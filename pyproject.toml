[project]
name = "minslam"
version = "0.1.0"
description = "A minimum python visual SLAM system"
authors = [{name = "Junzhe Wu", email = "coin12.wu@gmail.com"}]
dependencies = ["pytorch-lightning>=2.6.1,<3", "pytorch-metric-learning==2.3.0"]

[tool.setuptools]
packages = ["minslam"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.dependencies]
python = "3.11.*"
ipykernel = ">=7.2.0,<8"
numpy = "<2.0.0"
matplotlib = ">=3.10.8"
opencv = ">=4.10" 
gtsam = ">=4.2"
ipympl = ">=0.10.0"
nbformat = ">=5.10.4"
pytorch = ">=2.10.0,<3"
torchvision = ">=0.26.0,<0.27"

[tool.pixi.pypi-dependencies]
spatialmath-python = ">=1.1.15"
evo = ">=1.34.3"
plotly = { version = ">=6.6.0", extras = ["express"] }
minslam = { path = ".", editable = true }
